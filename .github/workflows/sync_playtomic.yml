name: Sincronización Playtomic 24/7 en la Nube

on:
  schedule:
    # Se ejecuta de forma autónoma cada 5 minutos día y noche (24/7/365)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite forzar la sincronización en vivo desde la web de GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  playtomic-cloud-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar motor autónomo Playtomic
        run: |
          python scraper/playtomic_auto_daemon.py --once

      - name: Persistir snapshot actualizado
        run: |
          git config --local user.email "bot-playtomic@somospadel.com"
          git config --local user.name "SomosPadel Playtomic Bot"
          git add scraper/playtomic_extracted.json scraper/playtomic_tournaments_urls.txt || true
          git diff --staged --quiet || git commit -m "🤖 [Cloud Bot] Sincronización automática Playtomic ⇄ Firestore"
          git push origin main || git push origin master || true
