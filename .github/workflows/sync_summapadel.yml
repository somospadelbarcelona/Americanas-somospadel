name: Sync Summapadel Data

on:
  schedule:
    # Se ejecuta cada 4 horas (en horario UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite iniciar la sincronización de forma manual desde la pestaña Actions en GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright firebase-admin
        playwright install chromium

    - name: Run Scraper and Sync
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: python scraper/bot_summapadel.py
