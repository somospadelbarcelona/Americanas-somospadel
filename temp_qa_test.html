<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>QA Test PointsPolicy</title>
</head>
<body>
    <div id="app"></div>
    <script src="file:///c:/Users/acoscolin/OneDrive - GRUPO SIFU INTEGRACION LABORAL SL/Escritorio/ALEX/AMERICANAS/js/modules/ui/PointsPolicyModal.js"></script>
    <script>
        const logs = [];
        window.addEventListener('error', (e) => {
            logs.push({type: 'error', message: e.message, filename: e.filename, lineno: e.lineno});
        });

        try {
            logs.push({test: 'defined', hasModal: typeof window.PointsPolicyModal !== 'undefined'});
            logs.push({test: 'hasShowFn', hasFn: typeof window.showPointsPolicyModal === 'function'});

            // Test getPointsForRank
            const p1 = window.PointsPolicyModal.getPointsForRank(1);
            const p2 = window.PointsPolicyModal.getPointsForRank(2);
            const p3 = window.PointsPolicyModal.getPointsForRank(3);
            const p4 = window.PointsPolicyModal.getPointsForRank(4);
            const p10 = window.PointsPolicyModal.getPointsForRank(10);
            const p12 = window.PointsPolicyModal.getPointsForRank(12);
            const p13 = window.PointsPolicyModal.getPointsForRank(13);
            const p20 = window.PointsPolicyModal.getPointsForRank(20);
            logs.push({test: 'ranks', p1, p2, p3, p4, p10, p12, p13, p20});

            // Test calculateTotal
            const t1 = window.PointsPolicyModal.calculateTotal(1, 4);
            const t2 = window.PointsPolicyModal.calculateTotal(3, 2);
            const t3 = window.PointsPolicyModal.calculateTotal(15, 0);
            logs.push({test: 'totals', t1, t2, t3});

            // Test open
            window.showPointsPolicyModal();
            const overlay = document.getElementById('sp-points-policy-overlay');
            logs.push({test: 'openOverlay', exists: !!overlay});

            // Test recalcSim
            window.PointsPolicyModal.recalcSim();
            const totalEl = document.getElementById('sp-sim-total-val');
            logs.push({test: 'recalcSim', text: totalEl ? totalEl.textContent.trim() : null});

            // Test close
            window.PointsPolicyModal.close();
            logs.push({test: 'closeInitiated', success: true});

        } catch (err) {
            logs.push({type: 'exception', message: err.message, stack: err.stack});
        }

        const div = document.createElement('div');
        div.id = 'qa-results';
        div.textContent = JSON.stringify(logs);
        document.body.appendChild(div);
    </script>
</body>
</html>
